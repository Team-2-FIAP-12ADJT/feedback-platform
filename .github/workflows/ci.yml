# Validacao de toda PR e todo push na main: build e testes com Java 25 e lint do template SAM (ADR 0013, ADR 0026, ADR 0021).
# E o check que a protecao da main exige antes do merge; o deploy so roda depois dele verde.
name: ci

on:
  pull_request:
  # Push so na main: nas outras branches a PR ja valida, e o deploy depende deste run.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Unitarios e integracao: os testes de integracao sobem o DynamoDB Local com Testcontainers (ADR 0010).
      - name: mvn verify
        run: mvn -B -ntp verify

  sam-lint:
    name: sam-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # O template usa Fn::ForEach da transformacao AWS::LanguageExtensions (ADR 0020).
      SAM_CLI_ENABLE_LANGUAGE_EXTENSIONS: '1'
      SAM_CLI_TELEMETRY: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      # O template exige SAM CLI 1.161.0 ou mais novo para Fn::ForEach (ADR 0020).
      - name: Conferir versao do SAM CLI
        run: |
          v=$(sam --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          printf '%s\n' 1.161.0 "$v" | sort -V -C || { echo "::error::SAM CLI $v, minimo 1.161.0"; exit 1; }
      # O lint roda local, sem credencial da AWS: PR nao recebe credencial (ADR 0013).
      - name: sam validate --lint
        run: sam validate --lint --template-file template.yaml --region sa-east-1
      - name: cfn-lint do bootstrap
        run: pipx run cfn-lint --regions sa-east-1 -- infra/bootstrap-oidc.yaml
